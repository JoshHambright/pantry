# Self-hosted stack: the app and its database. Bring it up with
#   docker compose up -d
# after copying .env.example to .env and filling it in. See docs/DEPLOY.md.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pantry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pantry}
    volumes:
      - pantry-db:/var/lib/postgresql/data
      # Nightly dumps land here; DEPLOY.md explains how to restore one.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pantry} -d ${POSTGRES_DB:-pantry}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app container needs to reach the database.
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pantry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pantry}
      PORT: 8080
      HOST: 0.0.0.0
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-claude-opus-5}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-Pantry/0.1 (self-hosted household inventory)}
    ports:
      - '${APP_PORT:-8080}:8080'

volumes:
  pantry-db:
